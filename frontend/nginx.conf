# nginx del frontend (ambiente local).
#
# El SPA y la API comparten origen: las peticiones /api van al backend, de modo
# que las cookies de sesión y CSRF se comportan igual que en producción (donde
# el rewrite lo hace Firebase Hosting). Para cualquier otra ruta se sirve el
# index.html y el router resuelve en el cliente.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # El backend admite cuerpos de hasta 25 MB (margen sobre el límite de 20 MB).
  client_max_body_size 25m;

  location /api/ {
    # Resolver de Docker: el backend se resuelve en cada petición, así nginx
    # arranca aunque el backend todavía no tenga nombre en la red.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
