# Configuración del backend.
#
# Los valores sensibles y los que cambian entre ambientes llegan por variables de
# entorno. En local y en las pruebas, Quarkus levanta PostgreSQL automáticamente
# (Dev Services) cuando no se indica una URL.

# --- Registros -----------------------------------------------------------------
# El identificador de petición acompaña a cada línea para poder correlacionar una
# respuesta con su traza completa.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) [%X{requestId}] %s%e%n

# --- Estado de salud -----------------------------------------------------------
# Los endpoints quedan en /health/live y /health/ready.
quarkus.smallrye-health.root-path=/health

# --- Base de datos -------------------------------------------------------------
# El proveedor actual es Neon PostgreSQL. La URL y las credenciales se pasan con
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME y
# QUARKUS_DATASOURCE_PASSWORD. No se define una URL por defecto a propósito: así
# Dev Services puede levantar una base desechable en local y en las pruebas.
quarkus.datasource.db-kind=postgresql

# Se desactiva la comprobación automática del pool: la nuestra pasa por el
# mediador de datos y, además, la del framework incluye host, puerto y detalle
# del error en la respuesta, que no deben salir de la aplicación.
quarkus.datasource.health.enabled=false

# --- Almacenamiento de objetos -------------------------------------------------
# El proveedor actual expone la API S3. Endpoint y credenciales se pasan con
# QUARKUS_S3_ENDPOINT_OVERRIDE, QUARKUS_S3_AWS_REGION,
# QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID y
# QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY.
app.storage.bucket=files

# La región forma parte de la firma de cada petición; no es un secreto.
quarkus.s3.aws.region=us-east-1
quarkus.s3.path-style-access=true

# --- Almacenamiento de objetos: entorno de desarrollo --------------------------
# En desarrollo, Quarkus levanta un stack local compatible con S3 y configura por
# su cuenta el endpoint, las credenciales y la región. El bucket debe coincidir
# con app.storage.bucket.
quarkus.s3.devservices.enabled=true
quarkus.s3.devservices.buckets=files

# En las pruebas no se levanta: el mediador de almacenamiento se sustituye por un
# doble y así las pruebas no dependen de un contenedor adicional. En producción
# el endpoint real llega por variables de entorno.
%test.quarkus.s3.devservices.enabled=false
