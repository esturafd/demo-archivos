# Configuración del backend.
#
# Solo lo que necesita la fase actual: el identificador de petición en los registros.
# El resto se irá añadiendo por fase (base de datos, almacenamiento, seguridad...).

# El identificador de petición acompaña a cada línea de registro para poder
# correlacionar una respuesta con su traza completa.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) [%X{requestId}] %s%e%n
