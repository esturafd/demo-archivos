# Configuración del backend.
#
# Los valores sensibles y los que cambian entre ambientes llegan por variables de
# entorno. En local y en las pruebas, Quarkus levanta PostgreSQL automáticamente
# (Dev Services) cuando no se indica una URL.

# --- Registros -----------------------------------------------------------------
# Salida estructurada en JSON. El identificador de petición viaja como campo de
# nivel raíz (MDC que fija el filtro de petición), de modo que todo lo que provoca
# una petición se puede correlacionar. En producción, una línea por evento.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.mdc.flat-fields=true

# En desarrollo se indenta para que sea legible.
%dev.quarkus.log.console.json.pretty-print=true

# Niveles: informativo en producción; en desarrollo y pruebas, el paquete propio
# es más verboso para ver el recorrido de cada petición.
quarkus.log.level=INFO
quarkus.log.category."me.esturafd".level=INFO
%dev.quarkus.log.category."me.esturafd".level=DEBUG
%test.quarkus.log.category."me.esturafd".level=DEBUG

# Las pruebas escriben además a un archivo JSON, para poder comprobar el formato
# y que no queden credenciales en el registro.
%test.quarkus.log.file.enabled=true
%test.quarkus.log.file.path=build/test-logs/app.log
%test.quarkus.log.file.json.enabled=true
%test.quarkus.log.file.json.mdc.flat-fields=true

# --- Estado de salud -----------------------------------------------------------
# Los endpoints quedan en /health/live y /health/ready.
quarkus.smallrye-health.root-path=/health

# --- Base de datos -------------------------------------------------------------
# El proveedor actual es Neon PostgreSQL. La URL y las credenciales se pasan con
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME y
# QUARKUS_DATASOURCE_PASSWORD. No se define una URL por defecto a propósito: así
# Dev Services puede levantar una base desechable en local y en las pruebas.
quarkus.datasource.db-kind=postgresql

# Se desactiva la comprobación automática del pool: la nuestra pasa por el
# mediador de datos y, además, la del framework incluye host, puerto y detalle
# del error en la respuesta, que no deben salir de la aplicación.
quarkus.datasource.health.enabled=false

# El mediador de datos gestiona la transacción de forma explícita para poder
# fijar el contexto (app.set_context) y confirmar o revertir en el mismo lugar.
# Se desactiva la integración JTA de Agroal para no mezclar dos modelos.
quarkus.datasource.jdbc.transactions=disabled

# Rol de ejecución al que cada transacción cambia (SET LOCAL ROLE) para quedar
# sujeta a RLS. Lo fija el esquema: las políticas conceden a app_runtime, así que
# es el mismo en todos los ambientes. Se deja por defecto y puede sobrescribirse
# por entorno. En las pruebas permite, además, que la conexión use el usuario
# privilegiado que levanta Dev Services y aun así quede sujeta a RLS.
app.database.runtime-role=app_runtime

# --- Almacenamiento de objetos -------------------------------------------------
# El proveedor actual expone la API S3. Endpoint y credenciales se pasan con
# QUARKUS_S3_ENDPOINT_OVERRIDE, QUARKUS_S3_AWS_REGION,
# QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID y
# QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY.
app.storage.bucket=files

# La región forma parte de la firma de cada petición; no es un secreto.
quarkus.s3.aws.region=us-east-1
quarkus.s3.path-style-access=true

# --- Almacenamiento de objetos: entorno de desarrollo --------------------------
# En desarrollo, Quarkus levanta un stack local compatible con S3 y configura por
# su cuenta el endpoint, las credenciales y la región. El bucket debe coincidir
# con app.storage.bucket.
quarkus.s3.devservices.enabled=true
quarkus.s3.devservices.buckets=files

# En las pruebas no se levanta: el mediador de almacenamiento se sustituye por un
# doble y así las pruebas no dependen de un contenedor adicional. En producción
# el endpoint real llega por variables de entorno.
%test.quarkus.s3.devservices.enabled=false

# --- Autenticación y sesiones ---------------------------------------------------
# Nombre de la cookie de sesión y su vigencia.
#
# En producción el frontend va detrás de **Firebase Hosting**, que descarta las
# cookies de la petición salvo la que se llama `__session`. Por eso el nombre en
# producción es `__session`; en las pruebas se usa `session` (no aplica la
# restricción y las pruebas la referencian por ese nombre).
app.auth.cookie.name=__session
%test.app.auth.cookie.name=session
app.auth.session.ttl=PT12H

# La cookie se marca Secure en producción. En local y en las pruebas viaja por
# HTTP, así que se desactiva para que el cliente pueda enviarla de vuelta.
app.auth.cookie.secure=true
%dev.app.auth.cookie.secure=false
%test.app.auth.cookie.secure=false

# Límite de intentos de inicio de sesión: ventana temporal y máximo de intentos.
app.auth.rate-limit.max-attempts=5
app.auth.rate-limit.window=PT15M

# Clave para el HMAC con que se indexan los intentos. Nunca se guardan correo ni
# IP en claro. En producción debe llegar por variable de entorno.
app.auth.rate-limit.key=${APP_AUTH_RATE_LIMIT_KEY:clave-de-desarrollo-no-usar-en-produccion}

# --- Protección CSRF ------------------------------------------------------------
# La autenticación es por cookie, así que todo método que modifica estado exige
# el token CSRF (patrón de doble envío): el cliente reenvía en la cabecera
# X-CSRF-TOKEN el valor de la cookie csrf-token.
app.auth.csrf.cookie-name=csrf-token
app.auth.csrf.header-name=X-CSRF-TOKEN

# --- Archivos -------------------------------------------------------------------
# Límite del cuerpo de la petición. Se deja un poco por encima de 20 MB para que
# el archivo llegue a la validación de la aplicación (que responde con el cuerpo
# de error uniforme); pasado ese margen, el servidor rechaza antes de leer.
quarkus.http.limits.max-body-size=25M

# --- Contrato OpenAPI -----------------------------------------------------------
# El documento se publica en /q/openapi (y en /q/openapi?format=json). La interfaz
# Swagger UI solo está en desarrollo y pruebas: en producción queda desactivada
# (valor por defecto), para no exponer la superficie de la API.
quarkus.swagger-ui.always-include=false

# Los identificadores de operación se forman con el nombre de la clase y el del
# método, de modo que sean estables para quien genere un cliente a partir del
# contrato.
quarkus.smallrye-openapi.operation-id-strategy=class-method

# Las etiquetas se declaran a mano en cada recurso; así no se deduce una por el
# nombre de la clase y el agrupamiento queda bajo control.
quarkus.smallrye-openapi.auto-add-tags=false
